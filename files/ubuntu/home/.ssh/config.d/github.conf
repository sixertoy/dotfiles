Match host github.com exec "ssh-add -L 2>/dev/null | grep -qF -f ~/.ssh/id_yubikey_5c.pub || (ssh-add -e /usr/lib/x86_64-linux-gnu/libykcs11.so 2>/dev/null; ssh-add -s /usr/lib/x86_64-linux-gnu/libykcs11.so < /dev/tty)"

Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_yubikey_5c.pub
    IdentitiesOnly yes
